# Local development only: fake Google sign-in, local KMS key file, throwaway
# database password. See docs/DEPLOY.md for production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentkeyring
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: agentkeyring
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentkeyring"]
      interval: 2s
      retries: 20

  app:
    build: { context: ., target: dev }
    ports:
      - "8080:8080"
      - "8091:8091" # fake Google shares this container's network
    environment:
      NODE_ENV: development
      BASE_URL: http://localhost:8080
      MODE: ${MODE:-self_hosted}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
      DATABASE_URL: postgres://agentkeyring:dev-only-password@db:5432/agentkeyring
      GOOGLE_ISSUER: http://localhost:8091
      GOOGLE_CLIENT_ID: dev-client
      GOOGLE_CLIENT_SECRET: dev-client-secret
      KMS_PROVIDER: local
      LOCAL_KMS_KEY_FILE: /keys/local-kms.key
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - kmskey:/keys
    depends_on:
      db: { condition: service_healthy }

  # Same network namespace as app, so http://localhost:8091 works both for the
  # browser and for the app's server-side token exchange.
  fake-google:
    build: { context: ., target: dev }
    command: ["npx", "tsx", "dev/fake-google.ts"]
    network_mode: "service:app"
    environment:
      PORT: "8091"
      GOOGLE_CLIENT_ID: dev-client
      FAKE_GOOGLE_ISSUER: http://localhost:8091
    depends_on: [app]

volumes:
  pgdata:
  kmskey:
